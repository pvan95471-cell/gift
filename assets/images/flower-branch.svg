<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9AA78" stop-opacity="0" />
      <stop offset="25%" stop-color="#C9AA78" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#E5D1AA" stop-opacity="1" />
      <stop offset="75%" stop-color="#C9AA78" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C9AA78" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="petalWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EBDD" />
    </linearGradient>
  </defs>

  <!-- Horizontal Fine Gold Rule -->
  <line x1="30" y1="60" x2="370" y2="60" stroke="url(#goldLine)" stroke-width="1" />

  <!-- Center Botanical Motif: Stylized White Flower Buds & Champagne Leaves -->
  <g transform="translate(200, 60)">
    <!-- Central Starlight -->
    <path d="M 0 -18 L 3 -4 L 17 0 L 3 4 L 0 18 L -3 4 L -17 0 L -3 -4 Z" fill="#E5D1AA" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />

    <!-- Left Branch -->
    <path d="M -15 0 C -40 -8, -75 -4, -110 -15" fill="none" stroke="#C9AA78" stroke-width="1.2" stroke-linecap="round" />
    <!-- White Flower Buds / Petals on Left -->
    <ellipse cx="-45" cy="-12" rx="7" ry="4" transform="rotate(-25 -45 -12)" fill="url(#petalWhite)" stroke="#C9AA78" stroke-width="0.8" />
    <ellipse cx="-75" cy="-8" rx="8" ry="4.5" transform="rotate(-15 -75 -8)" fill="url(#petalWhite)" stroke="#C9AA78" stroke-width="0.8" />
    <ellipse cx="-100" cy="-20" rx="6" ry="3.5" transform="rotate(-30 -100 -20)" fill="url(#petalWhite)" stroke="#C9AA78" stroke-width="0.8" />

    <!-- Leaves on Left -->
    <path d="M -30 2 C -35 12, -50 14, -55 8 C -50 0, -35 -2, -30 2 Z" fill="#C9AA78" fill-opacity="0.4" stroke="#C9AA78" stroke-width="0.6" />
    <path d="M -60 0 C -68 10, -82 10, -85 4 C -80 -2, -65 -3, -60 0 Z" fill="#C9AA78" fill-opacity="0.4" stroke="#C9AA78" stroke-width="0.6" />

    <!-- Right Branch (Mirrored) -->
    <path d="M 15 0 C 40 -8, 75 -4, 110 -15" fill="none" stroke="#C9AA78" stroke-width="1.2" stroke-linecap="round" />
    <!-- White Flower Buds / Petals on Right -->
    <ellipse cx="45" cy="-12" rx="7" ry="4" transform="rotate(25 45 -12)" fill="url(#petalWhite)" stroke="#C9AA78" stroke-width="0.8" />
    <ellipse cx="75" cy="-8" rx="8" ry="4.5" transform="rotate(15 75 -8)" fill="url(#petalWhite)" stroke="#C9AA78" stroke-width="0.8" />
    <ellipse cx="100" cy="-20" rx="6" ry="3.5" transform="rotate(30 100 -20)" fill="url(#petalWhite)" stroke="#C9AA78" stroke-width="0.8" />

    <!-- Leaves on Right -->
    <path d="M 30 2 C 35 12, 50 14, 55 8 C 50 0, 35 -2, 30 2 Z" fill="#C9AA78" fill-opacity="0.4" stroke="#C9AA78" stroke-width="0.6" />
    <path d="M 60 0 C 68 10, 82 10, 85 4 C 80 -2, 65 -3, 60 0 Z" fill="#C9AA78" fill-opacity="0.4" stroke="#C9AA78" stroke-width="0.6" />

    <!-- Tiny Floating Sparkles -->
    <circle cx="-130" cy="-15" r="1.5" fill="#E5D1AA" opacity="0.8" />
    <circle cx="130" cy="-15" r="1.5" fill="#E5D1AA" opacity="0.8" />
    <circle cx="-25" cy="-22" r="1" fill="#FFFFFF" opacity="0.9" />
    <circle cx="25" cy="-22" r="1" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>