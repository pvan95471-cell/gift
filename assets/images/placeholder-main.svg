<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f30" />
      <stop offset="50%" stop-color="#1B2A40" />
      <stop offset="100%" stop-color="#101A29" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D1AA" />
      <stop offset="50%" stop-color="#C9AA78" />
      <stop offset="100%" stop-color="#9C7F4E" />
    </linearGradient>
    <radialGradient id="softLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C9AA78" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#C9AA78" stop-opacity="0" />
    </radialGradient>
    <pattern id="fineGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C9AA78" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="550" rx="16" fill="url(#softLight)" />
  <rect width="800" height="550" rx="16" fill="url(#fineGrid)" />

  <!-- Outer Double Gold Frame -->
  <rect x="20" y="20" width="760" height="510" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  <rect x="28" y="28" width="744" height="494" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="6,4" />

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" stroke-opacity="0.8">
    <!-- Top-Left -->
    <path d="M 35 50 L 50 35 M 35 35 L 60 35 M 35 35 L 35 60" />
    <circle cx="42" cy="42" r="1.5" fill="#C9AA78" />
    <!-- Top-Right -->
    <path d="M 765 50 L 750 35 M 765 35 L 740 35 M 765 35 L 765 60" />
    <circle cx="758" cy="42" r="1.5" fill="#C9AA78" />
    <!-- Bottom-Left -->
    <path d="M 35 500 L 50 515 M 35 515 L 60 515 M 35 515 L 35 490" />
    <circle cx="42" cy="508" r="1.5" fill="#C9AA78" />
    <!-- Bottom-Right -->
    <path d="M 765 500 L 750 515 M 765 515 L 740 515 M 765 515 L 765 490" />
    <circle cx="758" cy="508" r="1.5" fill="#C9AA78" />
  </g>

  <!-- Center Decorative Frame & Camera Art -->
  <g transform="translate(400, 210)">
    <!-- Aura circle -->
    <circle r="68" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.35" />
    <circle r="76" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="3,5" />
    
    <!-- Camera Icon Minimalist Luxury -->
    <g stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -36 -12 L -26 -26 L 26 -26 L 36 -12 L 46 -12 C 50 -12 53 -9 53 -5 L 53 36 C 53 40 50 43 46 43 L -46 43 C -50 43 -53 40 -53 36 L -53 -5 C -53 -9 -50 -12 -46 -12 Z" />
      <circle cx="0" cy="14" r="18" />
      <circle cx="0" cy="14" r="7" fill="#C9AA78" fill-opacity="0.25" />
      <circle cx="34" cy="-1" r="2.5" fill="url(#goldGrad)" stroke="none" />
      <!-- Star twinkle -->
      <path d="M -24 -2 L -24 -10 M -28 -6 L -20 -6" stroke-width="1.2" stroke-opacity="0.7" />
    </g>

    <!-- Gentle light stars -->
    <path d="M 0 -105 L 2 -95 L 12 -93 L 2 -91 L 0 -81 L -2 -91 L -12 -93 L -2 -95 Z" fill="url(#goldGrad)" opacity="0.7" />
    <path d="M 120 -50 L 121 -45 L 126 -44 L 121 -43 L 120 -38 L 119 -43 L 114 -44 L 119 -45 Z" fill="url(#goldGrad)" opacity="0.5" />
    <path d="M -130 -40 L -129 -35 L -124 -34 L -129 -33 L -130 -28 L -131 -33 L -136 -34 L -131 -35 Z" fill="url(#goldGrad)" opacity="0.5" />
  </g>

  <!-- Typography Instructions -->
  <g text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif">
    <text x="400" y="340" fill="#F7F3EC" font-size="22" font-weight="600" letter-spacing="4">
      KHUNG ẢNH KỶ NIỆM CHÍNH
    </text>
  </g>

  <g text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif">
    <text x="400" y="375" fill="#C9AA78" font-size="13" font-weight="500" letter-spacing="2">
      // THAY ẢNH CỦA BẠN TẠI ĐÂY
    </text>
    <text x="400" y="405" fill="#8FA0B5" font-size="12" letter-spacing="1">
      Đặt ảnh tại: <tspan fill="#F7F3EC">assets/images/main.jpg</tspan> hoặc chỉnh trong <tspan fill="#F7F3EC">js/config.js</tspan>
    </text>
    <text x="400" y="435" fill="#607185" font-size="11" font-style="italic">
      (Gợi ý: Một bức ảnh chân dung hoặc khoảnh khắc ấn tượng của người ấy)
    </text>
  </g>

  <!-- Subtle bottom ornament -->
  <path d="M 340 470 L 390 470 M 410 470 L 460 470" stroke="url(#goldGrad)" stroke-width="0.8" stroke-opacity="0.5" />
  <circle cx="400" cy="470" r="2.5" fill="#C9AA78" opacity="0.7" />
</svg>