<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="sealShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F3E5C8" />
      <stop offset="35%" stop-color="#D4B685" />
      <stop offset="70%" stop-color="#B6935C" />
      <stop offset="100%" stop-color="#805F2B" />
    </radialGradient>
    <linearGradient id="edgeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="50%" stop-color="#B8945D" />
      <stop offset="100%" stop-color="#6E5020" />
    </linearGradient>
    <filter id="seal3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B131E" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#FFF0D4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Wax Seal Wavy Organic Outer Edge -->
  <path d="M 80 10 
           C 92 11, 103 14, 114 22 
           C 126 31, 137 42, 143 55 
           C 149 68, 150 81, 146 95 
           C 142 109, 134 122, 122 131 
           C 111 140, 97 146, 83 147 
           C 69 148, 55 144, 43 136 
           C 31 127, 21 116, 16 102 
           C 11 88, 12 73, 18 60 
           C 24 46, 35 34, 48 26 
           C 59 17, 70 11, 80 10 Z" 
        fill="url(#sealShine)" filter="url(#seal3D)" stroke="url(#edgeRing)" stroke-width="1.5" />

  <!-- Inner Raised Ridge -->
  <circle cx="80" cy="80" r="48" fill="none" stroke="url(#edgeRing)" stroke-width="2" stroke-opacity="0.8" />
  <circle cx="80" cy="80" r="44" fill="none" stroke="#684A1C" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3,3" />

  <!-- Center Embossed Motif: 8-Pointed Star & Olive Flourish -->
  <g transform="translate(80, 80)">
    <!-- Shadow for depth -->
    <path d="M 0 -26 L 5 -7 L 24 -7 L 8 4 L 14 22 L 0 11 L -14 22 L -8 4 L -24 -7 L -5 -7 Z" fill="#6B4B1C" opacity="0.35" transform="translate(0, 1.5)" />
    <!-- Main Star -->
    <path d="M 0 -26 L 5 -7 L 24 -7 L 8 4 L 14 22 L 0 11 L -14 22 L -8 4 L -24 -7 L -5 -7 Z" fill="url(#edgeRing)" />
    <!-- Inner diamond highlight -->
    <path d="M 0 -14 L 3.5 0 L 0 14 L -3.5 0 Z" fill="#FFF8EB" opacity="0.75" />
    <circle cx="0" cy="0" r="3" fill="#6E5020" />
    <circle cx="0" cy="0" r="1.5" fill="#FFEEC9" />
  </g>
</svg>