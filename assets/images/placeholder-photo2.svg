<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <defs>
    <linearGradient id="innerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192535" />
      <stop offset="100%" stop-color="#243850" />
    </linearGradient>
    <linearGradient id="goldText2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CCA1" />
      <stop offset="100%" stop-color="#B38F56" />
    </linearGradient>
    <filter id="softShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Polaroid Cream Paper Base -->
  <rect width="500" height="620" rx="10" fill="#FAF7F2" stroke="#E2D8C7" stroke-width="1.5" filter="url(#softShadow2)" />

  <!-- Inner Photo Frame -->
  <rect x="35" y="35" width="430" height="430" rx="4" fill="url(#innerGrad2)" />
  <rect x="35" y="35" width="430" height="430" rx="4" fill="none" stroke="#C9AA78" stroke-width="1" stroke-opacity="0.4" />

  <!-- Inner Illustration: Peaceful Sun / Journey / Compass -->
  <g transform="translate(250, 240)">
    <circle r="48" fill="none" stroke="#C9AA78" stroke-width="1" stroke-opacity="0.3" />
    <!-- Compass Rose / Star -->
    <path d="M 0 -45 L 7 -10 L 42 0 L 7 10 L 0 45 L -7 10 L -42 0 L -7 -10 Z" fill="none" stroke="url(#goldText2)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="4" fill="url(#goldText2)" />
    <!-- Subtle coordinates / details -->
    <circle r="22" fill="none" stroke="#C9AA78" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.6" />
  </g>

  <!-- Label on Inner Photo -->
  <g text-anchor="middle" font-family="'Montserrat', sans-serif">
    <text x="250" y="380" fill="#E2CCA1" font-size="12" font-weight="600" letter-spacing="2">
      // THAY ẢNH 02 TẠI ĐÂY
    </text>
    <text x="250" y="405" fill="#8FA0B5" font-size="11" letter-spacing="1">
      assets/images/photo2.jpg
    </text>
  </g>

  <!-- Bottom Polaroid Handwritten Area -->
  <g text-anchor="middle">
    <text x="250" y="520" fill="#22334A" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" letter-spacing="1">
      Nụ Cười Bình Yên
    </text>
    <text x="250" y="555" fill="#718096" font-family="'Montserrat', sans-serif" font-size="11" letter-spacing="1.5">
      KỶ NIỆM SỐ 02 • 19.11
    </text>
  </g>
</svg>